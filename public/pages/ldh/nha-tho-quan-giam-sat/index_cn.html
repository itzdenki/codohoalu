/* Quy tắc nền tối thiểu cho nội dung xuất từ pdf2htmlEX */
*{box-sizing:content-box}
html,body{margin:0;padding:0}
#page-container{position:relative;margin:0 auto;padding:0}
.pf{position:relative;background-color:#fff;overflow:hidden;margin:0 auto;border:0;transform-origin:0 0}
.pc{position:absolute;border:0;padding:0;margin:0;top:0;left:0;width:100%;height:100%;overflow:hidden;display:block;transform-origin:0 0}
.pi{display:none}
.bf,.bi{position:absolute;left:0;bottom:0;border:0;margin:0;padding:0;-ms-user-select:none;-webkit-user-select:none;user-select:none}
.t{position:absolute;white-space:pre;transform-origin:0 100%;unicode-bidi:bidi-override}
._{display:inline-block;color:transparent;overflow:hidden;width:0;height:0}
.pc>*,.t{-webkit-font-smoothing:antialiased}
@media print{.pf{margin:0;box-shadow:none;page-break-after:always;page-break-inside:avoid}}

/* Dành riêng cho pdf2htmlEX (không cần thêm quy tắc) */

:root{--blue:#0b3ea8;--blue2:#1a8fe3;--gold:#f2b705;--ink:#1c2a44;--bg:#eef3fb}
*{-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#dfe7f3}
#sidebar,.loading-indicator{display:none}
a{color:var(--blue)}

/* ===== Trang chủ ===== */
.home{min-height:100vh;background:#0b2a6b url(/images/bg_v1_tinified.jpg) center top/cover fixed}
.wrap{max-width:760px;margin:0 auto;background:rgba(255,255,255,.96);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.35)}
.wrap>header img,.hero img{display:block;width:100%;height:auto}
.hero{background:linear-gradient(#fff,#e6f0fb);text-align:center;padding-bottom:6px;margin-top:-1px}
.hero img{max-width:520px;margin:-20px auto -50px}
.langs{display:flex;gap:10px;justify-content:center;padding:10px 12px}
.langs button{border:2px solid transparent;background:#fff;border-radius:999px;padding:4px 12px 4px 6px;display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.langs button img{width:28px;height:28px;border-radius:50%}
.langs button.on{border-color:var(--blue2);background:#e5f2ff}
.note{text-align:center;font-size:.85rem;color:#566;margin:0 16px 8px}
.gallery{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scroll-snap-type:x mandatory}
.gallery img{width:110px;height:110px;border-radius:12px;object-fit:cover;scroll-snap-align:start;border:2px solid var(--gold)}
section.site{padding:10px 16px 18px}
section.site h2{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;margin:14px 0 10px;padding:10px 14px;font-size:1.1rem;border-radius:10px;text-transform:uppercase}
.list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.list a{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border:1px solid #cfdcf0;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.list a:hover{background:#dbeaff;border-color:var(--blue2)}
.list b{flex:none;min-width:30px;height:30px;border-radius:50%;background:#d62839;color:#fff;display:grid;place-items:center;font-size:.85rem}
.list b.i{background:var(--blue2)}
.list small{display:block;color:#667;font-weight:400}
.wrap>footer img{display:block;width:100%;height:auto}
.wrap>footer p{margin:0;padding:10px;text-align:center;background:#0a3aa8;color:#fff;font-size:.8rem}

/* Trang thuyết minh */
body.tm{background:#1d2740;padding-bottom:96px}
#page-container{max-width:760px}
#page-container .pf{margin:0 auto 10px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.pfwrap{margin:0 auto 10px;overflow:hidden}
#page-container .pfwrap .pf{margin:0;box-shadow:none}
.pfwrap{box-shadow:0 2px 12px rgba(0,0,0,.4)}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#0b3ea8,#1a8fe3);color:#fff}
.topbar a{color:#fff;text-decoration:none;font-weight:700}
.topbar .sp{flex:1}
.topbar .fl{display:flex;gap:6px}
.topbar .fl button{border:2px solid transparent;border-radius:50%;padding:0;background:none;cursor:pointer;opacity:.6}
.topbar .fl button.on{border-color:#f2b705;opacity:1}
.topbar .fl img{width:28px;height:28px;border-radius:50%;display:block}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0b2a6b;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.4)}
.player .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;width:100%}
.player button{width:44px;height:44px;border-radius:50%;border:0;background:#f2b705;color:#0b2a6b;font-size:18px;cursor:pointer;flex:none}
.player input[type=range]{flex:1;min-width:0}
.player .tm{font-variant-numeric:tabular-nums;font-size:.8rem;flex:none}
.player.none{display:none}
